# voicechain – Startkonfiguration für Rode NT-USB → BlackHole 2ch → Zoom/Teams
# Alle Pegel in dBFS (0 dBFS = Vollaussteuerung), Zeiten in ms bzw. s wie benannt.
# Begründungen ausführlich in docs/02_Parameter_Begruendung.md. Die Kalibrierung
# (python -m voicechain calibrate) überschreibt die Werte innerhalb der Grenzen.
# Hinweis: Beim Speichern über voicechain.config.save_config gehen Kommentare verloren.

sample_rate: 48000          # Rode NT-USB arbeitet fest mit 48 kHz; kein Resampling nötig
block_size: 256             # ~5,3 ms je Block: Latenz klein, Dropout-Risiko gering

input:
  device: "RØDE NT-USB"     # Teilstring-Suche im Gerätenamen, Groß/Klein egal
  channel: 0                # das NT-USB liefert Mono auf Kanal 0
output:
  device: "BlackHole 2ch"   # virtuelles Kabel zu Zoom/Teams
  channels: 2               # Mono wird auf beide Kanäle dupliziert

chain:
  input_trim:
    gain_db: 0.0            # wird von der Kalibrierung gesetzt: aktive Sprache auf -20 dBFS RMS

  highpass:
    enabled: true           # false = Bypass (z. B. zum A/B-Hören)
    freq_hz: 80.0           # Männliche Grundfrequenz beginnt bei ~85 Hz; darunter nur Rumpeln,
                            # Trittschall, Plosiv-Energie und Schreibtisch-Körperschall
    order: 4                # 24 dB/Okt (Butterworth): 16 dB bei 50 Hz, 48 dB bei 20 Hz,
                            # 1 kHz bleibt unverändert; steiler klingt bei Sprache "dünn"

  expander:
    enabled: true           # false = Bypass; Rauschteppich bleibt dann in Pausen hörbar
    threshold_db: -45.0     # Rauschteppich eines ruhigen Büros mit NT-USB ~ -55 dBFS + 10 dB Abstand;
                            # 10 dB unter der Schwelle senkt die Kennlinie (Ratio 2,5, Knie 6) um 15 dB
    ratio: 2.5              # sanfte Absenkung statt hartem Gate: Pausen werden leiser, nicht "tot"
    range_db: 20.0          # mehr als 20 dB klingt wie Ein-/Ausschalten des Raums
    attack_ms: 5.0          # öffnet innerhalb eines Silbenanlauts, ohne den ersten Konsonanten zu kappen
    hold_ms: 100.0          # überbrückt die 80–150 ms zwischen Wörtern, verhindert Flattern (PO: 50 ms zu kurz)
    release_ms: 250.0       # Zeitkonstante des Schließens: Wortenden langsamer Sprecher bleiben ganz
    knee_db: 6.0            # weicher Übergang: Atmer und leise Silben werden nicht hart geschaltet

  deesser:
    enabled: true           # false = Bypass
    freq_hz: 6500.0         # Energiemaximum von "s"/"z" beim NT-USB (Kondensator, präsenzbetont)
    bandwidth_oct: 1.0      # 4,6–9,2 kHz: deckt "s", "sch" und "z" ab, lässt "t"-Transienten zu
    threshold_db: -30.0     # Bandpegel, ab dem Zischen bei -20 dBFS Sprachpegel störend wird
    ratio: 4.0              # kräftig genug, dass der Effekt greift, ohne zu lispeln (Schema: mindestens 1.1)
    max_reduction_db: 8.0   # Schutz vor "Lispeln" bei stark zischenden Stimmen
    attack_ms: 1.0          # Zischlaute sind kurz (50–150 ms): sofort reagieren
    release_ms: 60.0        # löst innerhalb des Lauts wieder, nächste Silbe unbeeinflusst

  eq:
    enabled: true           # false = Bypass aller Bänder
    tilt_db: 0.0            # optional, Klang-Tilt für die Live-Bedienung (-3…+3): Low-Shelf 250 Hz -tilt/2,
                            # High-Shelf 4 kHz +tilt/2; positiv = heller, negativ = wärmer; 0 = transparent
    bands:
      - {type: peak,       freq_hz: 220.0,   gain_db: -2.0, q: 1.0}    # Nahbesprechungs-Mulm der Niere (15–25 cm)
      - {type: peak,       freq_hz: 3200.0,  gain_db: 2.0,  q: 1.2}    # Präsenz: Konsonanten und Sprachverständlichkeit
      - {type: high_shelf, freq_hz: 10000.0, gain_db: 0.0,  q: 0.707}  # 0 dB: das NT-USB ist oben herum hell genug, ein Boost
                                                                        # hebt nur Preamp-Rauschen und Restzischen an (PO); nur als Cut nutzen

  compressor:
    enabled: true           # false = Bypass
    threshold_db: -20.0     # Referenzpegel aktiver Sprache nach Input Trim: Spitzen werden verdichtet
    ratio: 3.0              # Sprach-Standard: hörbar gleichmäßiger, noch natürlich (Schema: mindestens 1.1)
    knee_db: 6.0            # weiches Knie: Einsatz nicht hörbar
    attack_ms: 10.0         # lässt Konsonanten-Transienten durch (Verständlichkeit)
    release_ms: 100.0       # folgt Silben, pumpt nicht
    makeup_db: 0.0          # Startwert; die Kalibrierung setzt die statische Reduktion an den Sprachspitzen
                            # (typisch 4–7 dB), die Feinregelung übernimmt der Normalizer

  normalizer:
    enabled: true           # false = Bypass, Messung läuft weiter (Meter bleiben gültig)
    target_lufs: -18.0      # Konferenzsysteme erwarten etwa -18…-16 LUFS Sprache
    window_s: 3.0           # Short-Term-Lautheit nach BS.1770 (3 s)
    max_gain_db: 12.0       # mehr würde Rauschen in leisen Passagen hochziehen
    min_gain_db: -12.0      # Schutz gegen "Reinbrüllen"
    rate_db_per_s: 1.0      # Aufwärtsrate, langsam wie eine Hand am Fader: keine hörbare Regelbewegung
    release_rate_db_per_s: 3.0  # Abwärtsrate (optional, Default 3): ein zu lauter Satzanfang ist in 2 s gezähmt
    gate_lufs: -40.0        # absolutes Gate auf die Momentary-Lautheit (400 ms): darunter Pause → Gain einfrieren;
                            # Kalibrierung setzt Teppich nach Kette + 8; wirksam ist max(gate_lufs, Teppich-Schätzer + gate_margin_lu)
    gate_margin_lu: 8.0     # optional (Default 8): Abstand des wirksamen Gates über dem intern geschätzten Teppich;
                            # schützt, wenn der Raum nach der Kalibrierung lauter wird (Lüfter, Fenster)

  limiter:
    enabled: true           # false = Bypass; Achtung: entfernt auch die Lookahead-Latenz
    ceiling_dbfs: -1.0      # -1 dBTP: Sicherheitsabstand für Codec und D/A der Gegenseite
    lookahead_ms: 5.0       # Gesamt-Latenz der Kette; reicht für weiche Eingriffe
    release_ms: 50.0        # schnell genug, dass Sprache nach einer Spitze nicht "eingedrückt" bleibt

control:
  socket_path: "logs/control.sock"   # optional: Unix-Socket des Steuerkanals (MX Creative Console, `ctl`)

adaptive:
  enabled: true             # false = Parameter bleiben wie in der Datei
  learn_s: 30.0             # Lernphase ohne Eingriff: erst zuhören, dann regeln
  interval_s: 2.0           # Auswerteintervall der Meter
  max_step_db: 0.5          # maximale Änderung je Eingriff (langsam, unauffällig)
  log_path: "logs/adaptive.jsonl"   # JSONL-Protokoll jeder Änderung mit Grund
  bounds:                   # harte Grenzen je nachgeführtem Parameter [min, max]
    expander.threshold_db: [-70.0, -30.0]     # folgt dem Rauschteppich (+10 dB), nie über -30 dBFS
    deesser.threshold_db: [-45.0, -10.0]      # folgt dem Zischanteil; bis -10, weil Bandspitzen nach Trim nahe Vollaussteuerung liegen können
    compressor.threshold_db: [-35.0, -10.0]   # folgt dem Sprachpegel
    normalizer.max_gain_db: [0.0, 12.0]       # Limiter-Schutzregel senkt den Gain-Deckel; nie über den kalibrierten Wert
